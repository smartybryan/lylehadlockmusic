<section class="page auxpage">
    <nav class="breadcrumb"><a href="#!/gallery">Galleries</a> <i class="fa fa-angle-right"></i> {{gallery.name}}</nav>
    <h1 class="page-title">{{gallery.name}}</h1>

    <p class="page-lead" ng-bind-html="trustHtml(gallery.description)"></p>

    <div class="photo-grid">
        <a class="photo-card" ng-repeat="photo in gallery.photos" target="_blank" ng-href="{{photo.url}}">
            <img ng-src="{{photo.url}}" alt="{{photo.caption}}" loading="lazy">
            <span class="photo-card__caption" ng-show="photo.caption">{{photo.caption}}</span>
        </a>
    </div>
</section>
