<section class="page auxpage">
    <div class="page-head">
        <h1 class="page-title">Reviews</h1>
        <a class="btn" href="#!/reviews_submit"><i class="fa fa-pencil"></i> Submit a Review</a>
    </div>

    <div class="review-grid">
        <figure class="review-card" ng-repeat="review in reviews">
            <div class="stars" aria-label="{{review.stars}} out of 5 stars">
                <i class="fa fa-star" ng-repeat="i in getNumber(review.stars) track by $index"></i>
            </div>
            <blockquote>{{review.review}}</blockquote>
            <figcaption>
                <strong>{{review.name}}</strong>
                <span ng-show="review.location">{{review.location}}</span>
            </figcaption>
        </figure>
    </div>

    <div class="center">
        <a class="btn" href="#!/reviews_submit"><i class="fa fa-pencil"></i> Submit a Review</a>
    </div>
</section>
