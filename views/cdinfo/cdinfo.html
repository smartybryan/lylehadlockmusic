<section class="page auxpage">
    <nav class="breadcrumb"><a href="#!/main">Home</a> <i class="fa fa-angle-right"></i> {{cd.title}}</nav>

    <div class="album-detail">
        <img class="album-detail__cover" ng-src="{{cd.image}}" alt="{{cd.title}} album cover">

        <div class="album-detail__body">
            <p class="eyebrow">Album</p>
            <h1>{{cd.title}}</h1>

            <div class="stream-links">
                <a class="stream-link" ng-show="cd.spotify" target="_blank" rel="noopener" ng-href="{{cd.spotify}}">
                    <img alt="" src="img/Spotify_icon.svg.png"> Spotify</a>
                <a class="stream-link" ng-show="cd.itunes" target="_blank" rel="noopener" ng-href="{{cd.itunes}}">
                    <i class="fa fa-apple"></i> Apple Music</a>
                <a class="stream-link" ng-show="cd.amazon" target="_blank" rel="noopener" ng-href="{{cd.amazon}}">
                    <i class="fa fa-amazon"></i> Amazon</a>
            </div>

            <div class="free-download">
                <i class="fa fa-download"></i>
                <div>
                    <strong>Download a full song free</strong>
                    <a ng-href="{{cd.free_download.url}}">{{cd.free_download.title}}</a>
                </div>
            </div>

        </div>
    </div>

    <h2>Tracks</h2>
    <ol class="tracklist">
        <li class="track" ng-repeat="track in cd.tracks" ng-class="{'is-playing': trackPlaying == track.number}">
            <button class="track__play" type="button"
                    ng-click="trackPlaying == track.number ? stop() : play(track.url, track.number)"
                    aria-label="{{trackPlaying == track.number ? 'Stop' : 'Play'}} {{track.title}}">
                <i class="fa" ng-class="trackPlaying == track.number ? 'fa-stop' : 'fa-play'"></i>
            </button>
            <span class="track__number">{{track.number}}</span>
            <span class="track__title">{{track.title}}</span>
            <span class="track__length">{{track.length}}</span>
        </li>
    </ol>

    <h2>About this album</h2>
    <p class="prose" ng-bind-html="trustHtml(cd.info)"></p>

</section>
