    <h1>{{cd.title}}</h1>

    <span class="cd_cover_block">
        <img class="cd_cover_image" src="{{cd.image}}">
    </span>

    <span class="cd_misc_info">
        <br>
        <!--Conditional logic until it is available-->
        <span ng-hide="cd.id == 'none'">
            <span ng-show="cd.spotify">
                <a target="_blank" OnFocus="this.blur();" href="{{cd.spotify}}">
                    <img width="30" height="30" alt="Listen on Spotify" border="0" src="img/Spotify_icon.svg.png"></a></span>
            <span ng-show="cd.itunes">
                <a target="_blank" OnFocus="this.blur();" href="{{cd.itunes}}">
                    <img width="80" height="40" alt="Download iTunes" border="0" src="img/Apple-Music-Logo.png"></a>
            </span>
            <span ng-show="cd.amazon">
                <a target="_blank" href="{{cd.amazon}}">
                    <img width="100" height="30" alt="Amazon" border="0" src="img/amazon-logo.gif"></a>
            </span>
            <br><br>
        </span>
        <div>
            <strong>Download full song free!</strong>
            <br>
            <a href="{{cd.free_download.url}}">{{cd.free_download.title}}</a>
        </div>
        <br><br>

        <!--Conditional Mother's Day link-->
<!--
         <span ng-show="cd.id == 'ss'">

        </span>
 -->

    <table>
        <tr>
        <th>#</th>
        <th>Track Name</th>
        <th>Length</th>
        </tr>
        <tr ng-repeat="track in cd.tracks">
            <td>{{track.number}}</td>
            <td>
                <button ng-click="play(track.url, track.number)" ng-show="trackPlaying != track.number"><i class="fa fa-play"></i></button>
                <button ng-click="stop()" ng-show="trackPlaying == track.number"><i class="fa fa-stop"></i></button>
                &nbsp;{{track.title}}
            </td>
            <td>{{track.length}}</td>
        </tr>
    </table>

    <h2>Info</h2>
    <p ng-bind-html="trustHtml(cd.info)"></p>
