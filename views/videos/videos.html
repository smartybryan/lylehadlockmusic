<section class="page auxpage">
    <h1 class="page-title">Videos</h1>

    <div class="video-list">
        <article class="video-card" ng-repeat="video in videos">
            <div class="video-embed">
                <iframe ng-src="{{video.url | trusted}}" title="Lyle Hadlock video {{$index + 1}}"
                        frameborder="0" allow="encrypted-media" allowfullscreen loading="lazy">
                </iframe>
            </div>
            <p>{{video.description}}</p>
        </article>
    </div>
</section>
