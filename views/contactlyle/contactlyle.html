<section class="page page--narrow auxpage">
    <h1 class="page-title">Contact Lyle</h1>
    <p class="page-lead">Questions about the music, arrangements, or performances? Send Lyle a note.</p>

    <form class="form card" action="http://lylehadlockmusic.com/cgi-bin/monstermail" enctype="multipart/form-data"
          name="SendMessage" onSubmit="return SendMessageCheckRequiredFields()" method="POST">
        <input type="hidden" name="redirect" value="http://lylehadlockmusic.com/#!/contactlyle_success">
        <input type="hidden" name="subject" value="Contact Lyle Email"/>
        <input type="hidden" name="from" value=""/>

        <div class="field">
            <label for="mailfrom">Your email address</label>
            <input type="email" id="mailfrom" name="mailfrom" tabindex="1">
        </div>
        <div class="field">
            <label for="message">Message to Lyle</label>
            <textarea rows="8" id="message" name="message" tabindex="2"></textarea>
        </div>
        <button class="btn" type="submit" tabindex="3"><i class="fa fa-paper-plane"></i> Send Message</button>
    </form>

    <div class="note">
        <strong>Privacy Statement</strong>
        <p>Your email address will not in any way be shared with anyone else. By providing your email address it
            simply gives Lyle the ability to answer any questions you have.</p>
    </div>
</section>
