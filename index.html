<!DOCTYPE html>
<html lang="en" ng-app="mainApp">
<head>
    <meta charset="utf-8">
    <title>The Music of Lyle Hadlock</title>
    <meta name="description"
          content="LyleHadlockMusic.com features relaxing and inspirational arrangements of the world's most beautiful hymns. Lyle Hadlock is a master pianist and composer which is reflected in his arrangements.">
    <meta name="keywords"
          content="Lyle Hadlock official site music hymns hymn relaxing inspirational instrumental piano lds sabbath composer music musical therapy ward mothers day gift cd idea sacrament meeting">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#16203f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body ng-controller="MainAppCtrl">

<header class="site-header">
    <div class="site-header__inner">
        <a class="brand" href="#!/main" ng-click="closeNav()">
            <span class="brand__name">Lyle Hadlock</span>
            <span class="brand__tag">Music</span>
        </a>

        <button class="nav-toggle" type="button" aria-label="Toggle navigation"
                ng-click="toggleNav()" ng-attr-aria-expanded="{{navOpen}}">
            <i class="fa" ng-class="navOpen ? 'fa-times' : 'fa-bars'"></i>
        </button>

        <nav class="site-nav" ng-class="{'is-open': navOpen}">
            <a href="#!/main" ng-class="{active: isActive('/main')}" ng-click="closeNav()">Home</a>
            <a href="#!/bio" ng-class="{active: isActive('/bio')}" ng-click="closeNav()">Bio</a>
            <a href="#!/gallery" ng-class="{active: isActive('/gallery')}" ng-click="closeNav()">Gallery</a>
            <a href="#!/reviews" ng-class="{active: isActive('/reviews')}" ng-click="closeNav()">Reviews</a>
            <a href="#!/sheetmusic" ng-class="{active: isActive('/sheetmusic')}" ng-click="closeNav()">Sheet Music</a>
            <a href="#!/videos" ng-class="{active: isActive('/videos')}" ng-click="closeNav()">Videos</a>
            <a href="#!/links" ng-class="{active: isActive('/links')}" ng-click="closeNav()">Links</a>
            <a class="site-nav__cta" href="#!/contactlyle" ng-class="{active: isActive('/contactlyle')}" ng-click="closeNav()">Contact</a>
        </nav>
    </div>
</header>

<main class="site-main">
    <div ng-view></div>
</main>

<footer class="site-footer">
    <div ng-include="'views/footer.html'"></div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.6.5/angular.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.6.5/angular-route.js"></script>
<script src="js/app.js"></script>
<script src="views/main/main.js"></script>
<script src="views/cdinfo/cdinfo.js"></script>
<script src="views/bio/bio.js"></script>
<script src="views/contactlyle/contactlyle.js"></script>
<script src="views/contactlyle/contactlyle_success.js"></script>
<script src="views/gallery/gallery.js"></script>
<script src="views/gallery/gallery_show.js"></script>
<script src="views/reviews/reviews.js"></script>
<script src="views/reviews/reviews_submit.js"></script>
<script src="views/reviews/reviews_success.js"></script>
<script src="views/links/links.js"></script>
<script src="views/sheetmusic/sheetmusic.js"></script>
<script src="views/videos/videos.js"></script>
<script src="views/sitefeedback/sitefeedback.js"></script>
<script src="views/sitefeedback/sitefeedback_success.js"></script>

<script type="text/javascript" language="JavaScript">
    function SendMessageCheckRequiredFields() {
        if (document.SendMessage.mailfrom.value.length == 0 ||
                document.SendMessage.message.value.length == 0) {
            alert('Please complete all fields before sending your message');
            return false;
        }
        document.SendMessage.from.value = document.SendMessage.mailfrom.value;
        return true;
    }

    function ReviewCheckRequiredFields() {
        if (document.AddReview.from.value.length == 0 ||
                document.AddReview.review.value.length == 0) {
            alert('Please fill-in at least Name and Review before submitting your review.');
            return false;
        }
        return true;
    }

</script>

</body>
</html>
