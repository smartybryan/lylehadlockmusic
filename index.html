<script type="text/javascript" language="JavaScript">
    function MothersDayCheckRequiredFields() {
        if (document.RequestInfo.bishop.value.length == 0 ||
                document.RequestInfo.ward.value.length == 0 ||
                document.RequestInfo.contact.value.length == 0 ||
                document.RequestInfo.mailfrom.value.length == 0 ||
                document.RequestInfo.phone.value.length == 0 ||
                document.RequestInfo.how.value.length == 0) {
            alert('Please complete all fields before clicking "Next Step"');
            return false;
        }
        document.RequestInfo.from.value = document.RequestInfo.mailfrom.value;
        return true;
    }

    function SendMessageCheckRequiredFields() {
        if (document.SendMessage.mailfrom.value.length == 0 ||
                document.SendMessage.message.value.length == 0) {
            alert('Please complete all fields before sending your message');
            return false;
        }
        document.SendMessage.from.value = document.SendMessage.mailfrom.value;
        return true;
    }

    function ReviewCheckRequiredFields() {
        if (document.AddReview.mailfrom.value.length == 0 ||
                document.AddReview.review.value.length == 0) {
            alert('Please fill-in at least Name and Review before submitting your review.');
            return false;
        }
        return true;
    }

</script>
